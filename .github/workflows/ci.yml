name: DADO Retail CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dado_retail_ci
          POSTGRES_USER: dado
          POSTGRES_PASSWORD: dado_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dado -d dado_retail_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=dado_retail_ci;Username=dado;Password=dado_ci_password
      Jwt__Key: ci_only_dado_retail_jwt_key_32_bytes_minimum
      Jwt__Issuer: DadoRetail
      Jwt__Audience: DadoRetailClients
      Pilot__BootstrapEnabled: 'true'
      Pilot__ProvidersEnabled: 'true'
      Pilot__AdminUsername: pilotadmin
      Pilot__AdminPassword: ci_pilot_password_12345
      PILOT_PASSWORD: ci_pilot_password_12345
      API_URL: http://localhost:5080
      ASPNETCORE_URLS: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/DadoRetail.Api/DadoRetail.Api.csproj
      - name: Build API
        run: dotnet build src/DadoRetail.Api/DadoRetail.Api.csproj -c Release --no-restore
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Verify EF model
        run: dotnet ef dbcontext info --project src/DadoRetail.Infrastructure/DadoRetail.Infrastructure.csproj --startup-project src/DadoRetail.Api/DadoRetail.Api.csproj
      - name: Apply committed migrations
        run: dotnet ef database update --project src/DadoRetail.Infrastructure/DadoRetail.Infrastructure.csproj --startup-project src/DadoRetail.Api/DadoRetail.Api.csproj
      - name: Start Pilot API
        run: |
          dotnet run --project src/DadoRetail.Api/DadoRetail.Api.csproj -c Release --no-build > /tmp/dado-api.log 2>&1 &
          echo $! > /tmp/dado-api.pid
          for i in {1..30}; do curl -fsS http://localhost:5080/health && exit 0; sleep 2; done
          cat /tmp/dado-api.log
          exit 1
      - name: Pilot end-to-end smoke test
        run: bash scripts/pilot-smoke.sh
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/dado-api.log || true
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [DadoRetail.Pos, DadoRetail.Admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: src/${{ matrix.app }}
        run: npm install
      - name: Build
        working-directory: src/${{ matrix.app }}
        run: npm run build
