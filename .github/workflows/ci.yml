name: DADO Retail CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/DadoRetail.Api/DadoRetail.Api.csproj
      - name: Build API
        run: dotnet build src/DadoRetail.Api/DadoRetail.Api.csproj -c Release --no-restore
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [DadoRetail.Pos, DadoRetail.Admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: src/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: src/${{ matrix.app }}
        run: npm run build
